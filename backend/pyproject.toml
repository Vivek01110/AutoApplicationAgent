[project]
name = "govflow-backend"
version = "0.1.0"
description = "GovFlow AI backend: autonomous agent for legacy government portals"
requires-python = ">=3.11"

[project.optional-dependencies]
local-stt = ["faster-whisper>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
